<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Locker Arcade Player</title><style>html,body{margin:0;width:100%;height:100%;background:#101623;color:#fff;font:16px system-ui,sans-serif}#game{width:100%;height:100%;display:grid;place-items:center}#notice{max-width:520px;padding:24px;text-align:center;color:#aeb8c9}</style><script src="https://unpkg.com/@ruffle-rs/ruffle"></script></head><body><main id="game"><p id="notice">Loading game…</p></main><script>const src=new URLSearchParams(location.search).get('src');const mount=document.querySelector('#game');if(!src){document.querySelector('#notice').textContent='This game link is missing its source.'}else{window.addEventListener('load',()=>{try{const ruffle=window.RufflePlayer.newest();const player=ruffle.createPlayer();player.style.width='100%';player.style.height='100%';mount.replaceChildren(player);player.load(src)}catch(e){document.querySelector('#notice').textContent='This game could not start. Try another game.'}})}</script></body></html>

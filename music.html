.music-page{padding-top:56px;padding-bottom:70px;min-height:76vh}.music-layout{display:grid;grid-template-columns:1fr 1.15fr;gap:72px;max-width:1080px;margin:auto;align-items:center}.music-editorial{position:relative;overflow:hidden;border:1px solid #363039;background:#19171c;border-radius:12px;padding:36px;min-height:420px}.music-kicker{font-size:12px;letter-spacing:.12em;color:#bba5db;font-weight:600}.music-editorial h1{font-size:52px;line-height:1.03;letter-spacing:-.045em;margin:22px 0 18px}.music-editorial p{color:#aaa;font-size:16px;line-height:1.6;position:relative;z-index:1}.record{width:220px;height:220px;position:absolute;right:-42px;bottom:-65px;border:1px solid #45404a;border-radius:50%;background:repeating-radial-gradient(circle,#151418 0 3px,#29262e 4px 5px);display:grid;place-items:center;transform:rotate(-18deg)}.record-label{background:#7945bf;width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff}.record-label span{font-size:9px;font-weight:400;letter-spacing:.1em}.music-directory-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:16px}.music-directory-heading h2{font-size:23px;letter-spacing:-.02em}.music-directory-heading>span{font-size:13px;color:#999}.listen-link{display:flex;align-items:center;gap:18px;padding:23px 4px;border-top:1px solid #333;transition:background .15s}.listen-link:hover{background:#1d1b20}.listen-link:last-of-type{border-bottom:1px solid #333}.listen-icon{display:grid;place-items:center;width:48px;height:48px;background:#292132;color:#c4a2ff;border:1px solid #443450;border-radius:10px;flex:none}.listen-icon svg{width:25px;height:25px}.listen-name strong{display:block;font-size:18px;font-weight:600}.listen-name small{display:block;font-size:13px;color:#999;margin-top:2px}.listen-action{margin-left:auto;padding:7px 15px;border:1px solid #4b3d5b;border-radius:6px;font-size:14px;color:#dfc9ff}.listen-link:hover .listen-action{background:#7c3aed;border-color:#7c3aed;color:white}.listening-note{font-size:14px;color:#999;line-height:1.65;margin-top:22px;max-width:360px}.music-back{display:inline-block;font-size:14px;color:#c4a2ff;margin-top:22px;text-decoration:underline;text-underline-offset:4px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:900px){.music-layout{gap:30px}.music-editorial{padding:26px}.music-editorial h1{font-size:44px}}@media(max-width:650px){.music-page{padding-top:28px}.music-layout{grid-template-columns:1fr;gap:32px}.music-editorial{min-height:280px}.music-editorial h1{font-size:40px}.record{width:180px;height:180px;right:-45px;bottom:-60px}.listen-link{gap:12px;padding:19px 0}.listen-action{padding:6px 10px}.listen-name strong{font-size:16px}}</style>
